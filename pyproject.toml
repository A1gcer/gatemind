[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gatemind"
version = "2.0.0"
description = "GateMind - AI Agent runtime quality & safety guardrails"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "A1gcer" }
]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.22.0"
]

[project.scripts]
gatemind = "skills.gatemind.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["skills*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["skills/gatemind/tests"]
