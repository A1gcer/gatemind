name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -e .
          pip install pytest ruff black

      - name: Lint
        run: |
          ruff check skills
          black --check skills

      - name: Validate policies
        run: |
          python3 skills/gatemind/scripts/validate_policies.py

      - name: Run tests
        run: |
          pytest -q
