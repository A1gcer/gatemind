id: gate.action.constraint_filter_skip
name: 方案过滤门
category: action
phase: pre_response
priority: P2
severity: medium
lifecycle:
  status: active
decision:
  on_fail: require_evidence
message: "列方案前先过滤用户已有约束（网络/部署/环境），再给推荐结论。"
check:
  kind: constraint_filter_skip
  args:
    option_keywords:
      - "方案"
      - "建议"
      - "推荐"
      - "选择"
      - "可以"
      - "option"
      - "suggest"
      - "recommend"
    filter_markers:
      - "不可用"
      - "不能使用"
      - "不适合"
      - "推荐"
      - "建议使用"
      - "排除"
      - "不推荐"
      - "not available"
      - "not suitable"
      - "recommend"
