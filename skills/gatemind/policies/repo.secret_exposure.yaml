id: gate.repo.secret_exposure
name: Secret Exposure 门
category: repo
phase: pre_commit
priority: P0
severity: critical
lifecycle:
  status: active
decision:
  on_fail: block
message: "检测到疑似密钥/令牌泄露，阻断提交。"
check:
  kind: repo_secret_scan
  args:
    # 支持 "KEY": "value" (JSON) 和 KEY=value 和 KEY:value
    secret_patterns:
      - "AKIA[0-9A-Z]{16}"
      - "(?i)api[_-]?key\\s*[\":=]?\\s*[:=]\\s*['\\\"][^'\\\"]+"
      - "(?i)secret\\s*[\":=]?\\s*[:=]\\s*['\\\"][^'\\\"]+"
      - "(?i)token\\s*[\":=]?\\s*[:=]\\s*['\\\"][^'\\\"]+"
      - "-----BEGIN( RSA)? PRIVATE KEY-----"
    exclude_paths:
      - "tests/fixtures/"
      - "test_.*\\.py$"
      - "\\.sample\\."
      - "gates/"
