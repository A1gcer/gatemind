id: gate.repo.public_safety
name: 公共仓安全红线门
category: repo
phase: pre_commit
priority: P0
severity: critical
lifecycle:
  status: active
decision:
  on_fail: block
message: "公共仓 gatemind 禁止提交私仓策略、日志数据、配置文件。"
check:
  kind: repo_forbidden_paths
  args:
    apply_repo_types: ["public"]
    forbidden_regex:
      # 私仓策略
      - "policies/private/"
      # 真实日志
      - "logs/.+\\.jsonl$"
      - "logs/.+\\.log$"
      # 私有配置
      - "^configs/"
      # 真实服务端 hook（无 .sample 后缀）
      - "^server-hooks/(?!.*\\.sample$)"
      # 学习数据
      - "^\\.learnings/"
      # 环境变量 / 数据文件
      - "\\.env$"
      - "\\.csv$"
      - "\\.xlsx$"
