id: gate.fact.guess_evidence_required
name: 推测依据检查
category: fact
phase: pre_response
priority: P2
severity: medium
lifecycle:
  status: active
decision:
  on_fail: require_evidence
message: "检测到推测表达，请补充依据或明确不确定性。"
check:
  kind: guess_without_evidence
  args:
    guess_words: ["可能", "大概", "应该", "我猜", "maybe", "probably"]
    evidence_words: ["根据", "证据", "日志", "来源", "数据", "我已检查"]
